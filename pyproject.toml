[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    ".pytest-pr-tmp",
    ".pytest-tmp*",
    ".pytest_tmp",
    ".tmp",
    "codex_export",
    "output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
